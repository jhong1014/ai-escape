<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 연구소 출입 통제 화면 — 상단 고정 상태바(이름·타이머·코드 조각), 아래에 방 지도 또는 방 내부 */
/* 테마: 로봇 친구 — 연보라 바탕, 둥근 카드, 아래로 눌리는 통통한 그림자 */
:root {
  --bg: #eef0ff;
  --panel: #ffffff;
  --ink: #2a2550;
  --muted: #6d6894;
  --line: #dcd9f5;
  --accent: #6c4dff;
  --accent-ink: #ffffff;
  --accent-soft: #e7e1ff;
  --accent-press: #4b2fd9;
  --ok: #10956f;
  --ok-soft: #d8f5ea;
  --bad: #d6455d;
  --bad-soft: #fde3e8;
  --lock: #aca8cc;
  --press: #cfc8f4;
  --r-lg: 18px;
  --r-md: 12px;
  --r-sm: 8px;
  --f-display: "Jua", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --f-body: "Gowun Dodum", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15132a; --panel: #1f1c3a; --ink: #ece9ff; --muted: #a6a1cc; --line: #34305a;
    --accent: #9b86ff; --accent-ink: #160d40; --accent-soft: #2c2560; --accent-press: #6a52e0;
    --ok: #3fd3a3; --ok-soft: #133b33; --bad: #ff7a8a; --bad-soft: #3f1c2a; --lock: #5a557f; --press: #0d0b1e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15132a; --panel: #1f1c3a; --ink: #ece9ff; --muted: #a6a1cc; --line: #34305a;
  --accent: #9b86ff; --accent-ink: #160d40; --accent-soft: #2c2560; --accent-press: #6a52e0;
  --ok: #3fd3a3; --ok-soft: #133b33; --bad: #ff7a8a; --bad-soft: #3f1c2a; --lock: #5a557f; --press: #0d0b1e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.6; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; text-wrap: balance; margin: 0; line-height: 1.25; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* 상태바 */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 920px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.brand { font-family: var(--f-display); font-size: 20px; display: flex; gap: 8px; align-items: center; }
.brand small { font-family: var(--f-body); font-size: 13px; color: var(--muted); }
.stat { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.timer { font-family: var(--f-mono); font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums; padding: 2px 10px; border-radius: 6px; background: var(--accent-soft); color: var(--ink); }
.timer.over { background: var(--bad-soft); color: var(--bad); }
.pieces { display: flex; gap: 4px; }
.pc { min-width: 28px; height: 30px; padding: 0 5px; display: grid; place-items: center; border: 1px dashed var(--line); border-radius: 5px; font-family: var(--f-mono); font-size: 14px; color: var(--lock); font-variant-numeric: tabular-nums; }
.pc.got { border-style: solid; border-color: var(--ok); color: var(--ok); background: var(--ok-soft); font-weight: 600; }

.wrap { max-width: 920px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 56px; display: flex; flex-direction: column; gap: 20px; }

/* 공통 */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 10px 16px; font-weight: 700; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.muted { color: var(--muted); }
.stripe { height: 8px; background: repeating-linear-gradient(-45deg, var(--accent) 0 10px, transparent 10px 20px); border-radius: 4px; }

/* 시작 화면 */
.intro { display: grid; gap: 18px; }
.intro h1 { font-size: clamp(38px, 8vw, 64px); }
.intro h1 span { color: var(--accent); }
.story { max-width: 62ch; font-size: 17px; }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.rule { border-left: 3px solid var(--accent); padding: 4px 12px; }
.rule b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 19px; }
.field { display: grid; gap: 4px; }
.field label { font-weight: 700; font-size: 14px; }
.field input { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 10px 12px; width: 100%; }
.form { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; max-width: 520px; }
@media (max-width: 480px) { .form { grid-template-columns: 1fr; } }

/* 지도 */
.map { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.door { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; min-height: 150px; position: relative; overflow: hidden; }
.door .plate { font-family: var(--f-mono); font-size: 12px; letter-spacing: .1em; color: var(--muted); display: flex; justify-content: space-between; }
.door h3 { font-size: 23px; }
.door .topic { font-size: 14px; color: var(--muted); }
.door .state { margin-top: auto; font-size: 13px; font-weight: 700; }
.door.open { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.door.open .state { color: var(--accent); }
.door.open:hover { transform: translateY(-2px); }
.door.done { border-color: var(--ok); }
.door.done .state { color: var(--ok); }
.door.locked { cursor: not-allowed; color: var(--lock); }
.door.locked h3, .door.locked .topic { color: var(--lock); }
.door.locked::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: repeating-linear-gradient(-45deg, var(--lock) 0 8px, transparent 8px 16px); }
.door.final { border-style: dashed; }
.door.final.open { border-style: solid; background: var(--accent-soft); }
@media (prefers-reduced-motion: no-preference) { .door { transition: transform .15s ease; } .pop { animation: pop .4s ease; } }
@keyframes pop { 0% { transform: scale(.94); opacity: .4 } 100% { transform: scale(1); opacity: 1 } }

/* 방 */
.room-head { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: end; }
.room-head h2 { font-size: clamp(28px, 6vw, 40px); }
.clue { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 0; }
.clue summary { cursor: pointer; padding: 12px 16px; font-weight: 800; list-style: none; display: flex; justify-content: space-between; }
.clue summary::-webkit-details-marker { display: none; }
.clue summary::after { content: "접기"; font-weight: 400; font-size: 13px; color: var(--muted); }
.clue:not([open]) summary::after { content: "펼치기"; }
.clue-body { padding: 0 16px 16px; display: grid; gap: 10px; }
.clue-body ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; font-variant-numeric: tabular-nums; min-width: 100%; background: var(--panel); }
th, td { border: 1px solid var(--line); padding: 6px 10px; text-align: center; white-space: nowrap; }
th { font-size: 13px; color: var(--muted); }

.task { display: grid; gap: 14px; }
.task-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.dots { display: flex; gap: 6px; }
.dot { width: 26px; height: 6px; border-radius: 3px; background: var(--line); }
.dot.on { background: var(--accent); }
.dot.ok { background: var(--ok); }
.q { font-size: 19px; font-weight: 800; max-width: 62ch; }
.q .blank { display: inline-block; min-width: 3.2em; border-bottom: 2px solid var(--accent); text-align: center; color: var(--accent); }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 12px 14px; }
.opt:hover { border-color: var(--ink); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.opts.ox { grid-template-columns: repeat(2, minmax(0, 160px)); }
.opts.ox .opt { font-family: var(--f-display); font-size: 40px; text-align: center; padding: 8px; }
.seq { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-height: 46px; padding: 8px; border: 1px dashed var(--line); border-radius: 8px; }
.seq .chip { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 6px; padding: 6px 10px; font-weight: 700; }
.seq .arrow { color: var(--muted); }
.seq .ph { color: var(--muted); font-size: 14px; }
.sort { display: grid; gap: 8px; }
.sort-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--panel); }
.sort-row > span { min-width: 0; flex: 1 1 260px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 7px 12px; font-size: 14px; font-weight: 700; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.sel { background: var(--accent); color: var(--accent-ink); }
.match { display: grid; gap: 8px; }
.match-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 10px; align-items: center; }
.match-row b { font-family: var(--f-display); font-weight: 400; font-size: 19px; }
.match-row select { width: 100%; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 9px 10px; }
@media (max-width: 520px) { .match-row { grid-template-columns: 1fr; gap: 4px; } }
.num { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.num input { width: 160px; max-width: 100%; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 10px 12px; font-family: var(--f-mono); font-size: 20px; }

/* 학교 목록 설정 (관리자 페이지에서 편집 → 수퍼베이스에 저장). 학년 · 반 · 번호는 학생이 입력한 학번에서 읽어요. */
const CKEY = "ai-lab-escape-config-v2";
const clone = o => JSON.parse(JSON.stringify(o));
const toInt = v => parseInt(String(v == null ? "" : v).replace(/[^0-9]/g, ""), 10) || 0;
function normCfg(c) {
  c = c || {};
  let list = Array.isArray(c.schools) ? c.schools : [];
  if (!list.length && c.school) list = [c.school];
  return { schools: [...new Set(list.map(x => String(x == null ? "" : x).replace(/\s+/g, " ").trim().slice(0, 40)).filter(Boolean))] };
}
function loadCfg() { try { const c = JSON.parse(localStorage.getItem(CKEY)); if (c) return normCfg(c); } catch (e) {} return normCfg({}); }
function cacheCfg() { try { localStorage.setItem(CKEY, JSON.stringify(CFG)); } catch (e) {} }
let CFG = loadCfg();
function fetchConfig() {
  if (!ONLINE) return Promise.resolve(false);
  return api("config").then(r => {
    const n = normCfg(r.config);
    const changed = JSON.stringify(n) !== JSON.stringify(CFG);
    CFG = n; cacheCfg();
    return changed;
  }, () => false);
}

function el(tag, attrs, ...kids) {

  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(c));

}
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* 방 순서: 학생마다 무작위 (이미 통과한 방이 있으면 그 방들을 앞에 둬요) */
function roomOrder() {
  const n = ROOMS.length, o = state.order;
  if (Array.isArray(o) && o.length === n && new Set(o).size === n && o.every(i => i >= 0 && i < n)) return o;
  const idx = [...Array(n).keys()];
  const done = idx.filter(i => state.cleared.includes(ROOMS[i].id));
  state.order = done.concat(shuffle(idx.filter(i => !done.includes(i))));
  save();
  return state.order;
}
/* 지금 열려 있는 방(순서상 아직 통과하지 않은 첫 방). 다 통과했으면 -1 */
function openRoom() { const o = roomOrder(); const i = o.find(k => !state.cleared.includes(ROOMS[k].id)); return i == null ? -1 : i; }
/* 방 안 문제 순서: 방마다 무작위 (이미 푼 문제 수는 그대로 앞에 둬요) */
function taskOrder(r) {
  const n = r.tasks.length;
  state.qorder = state.qorder || {};
  const o = state.qorder[r.id];
  if (Array.isArray(o) && o.length === n && new Set(o).size === n && o.every(i => i >= 0 && i < n)) return o;
  const solved = Math.min(state.taskIdx[r.id] || 0, n);
  const idx = [...Array(n).keys()];
  state.qorder[r.id] = idx.slice(0, solved).concat(shuffle(idx.slice(solved)));
  save();
  return state.qorder[r.id];
}

      el("div", null, el("div", { class: "eyebrow" }, r.id + " · " + r.topic), el("h2", null, r.name))),

  );

    r.tasks.map((_, k) => el("span", { class: "dot" + (k < ti ? " ok" : k === ti ? " on" : "") })));
  const hintUsed = state.hints.includes(r.id);

  const hintBtn = el("button", { class: "btn ghost", disabled: hintUsed, onclick: () => {

  } }, hintUsed ? "힌트 사용함" : "💡 힌트 보기 (1회)");

  const panel = el("div", { class: "panel task" },

/* 문제 유형 */
function makeTask(t, onSolved) {
  const box = el("div", { class: "task" });
  const fb = el("div", { role: "status", "aria-live": "polite" });
  const checkBtn = el("button", { class: "btn primary" }, "확인");
  let solved = false;
  let check;

  box.append(el("div", { class: "q", html: t.q }));
  if (t.img && t.type !== "tiles") box.append(el("img", { class: "task-img" + (t.imgNarrow ? " narrow" : ""), src: t.img, alt: t.imgAlt || "" }));

  if (t.type === "tiles") {
    const sel = new Set();
    const grid = el("div", { class: "grid" });
    for (let k = 0; k < 16; k++) {
      const b = el("button", { "aria-label": `${Math.floor(k / 4) + 1}줄 ${k % 4 + 1}번째 칸`, "aria-pressed": "false", onclick: () => {
        if (solved) return;
        sel.has(k) ? sel.delete(k) : sel.add(k);
        b.classList.toggle("sel", sel.has(k)); b.setAttribute("aria-pressed", sel.has(k));
      } });
      grid.append(b);
    }
    box.append(el("div", { class: "tiles" }, el("img", { src: t.img, alt: "강아지 사진과 블루베리 머핀 사진이 4×4로 섞여 있는 그림" }), grid));
    check = () => {
      if (!sel.size) return "강아지 칸을 눌러 주세요.";
      const ok = t.answer.length === sel.size && t.answer.every(a => sel.has(a));
      if (ok) return true;
      const right = t.answer.filter(a => sel.has(a)).length, extra = sel.size - right;
      return { wrong: `강아지 ${t.answer.length}칸 중 ${right}칸을 찾았어요.` + (extra ? ` 머핀을 ${extra}칸 골랐어요.` : "") + " 눈, 코가 있는지 자세히 보세요!" };
    };
  }

  if (t.type === "order") {
    const order = shuffledIdx(t.items.length); let seq = [];
    const seqBox = el("div", { class: "seq" }); const pool = el("div", { class: "opts" });
    const draw = () => {
      seqBox.innerHTML = "";
      if (!seq.length) seqBox.append(el("span", { class: "ph" }, "아래 카드를 순서대로 눌러요"));
      seq.forEach((v, k) => { if (k) seqBox.append(el("span", { class: "arrow" }, "→")); seqBox.append(el("span", { class: "chip" }, t.items[v])); });
      pool.innerHTML = "";
      order.forEach(v => pool.append(el("button", { class: "opt", disabled: seq.includes(v) || solved, onclick: () => { seq.push(v); draw(); } }, t.items[v])));
    };
    draw();
    box.append(seqBox, pool, el("div", { class: "row" }, el("button", { class: "btn ghost", onclick: () => { if (!solved) { seq = []; draw(); } } }, "다시 놓기")));
    check = () => seq.length < t.items.length ? "카드를 모두 눌러 주세요." : seq.every((v, k) => v === k);
  }

  if (t.type === "choice" || t.type === "ox") {
    const ox = t.type === "ox";
    const options = ox ? ["O", "X"] : t.options;
    const answer = ox ? [t.answer] : t.answer;
    const pick = answer.length;
    const idx = ox ? [0, 1] : shuffledIdx(options.length);
    const sel = new Set();
    const wrap = el("div", { class: "opts" + (ox ? " ox" : "") });
    const draw = () => {
      wrap.innerHTML = "";
      idx.forEach(k => wrap.append(el("button", { class: "opt" + (sel.has(k) ? " sel" : ""), "aria-pressed": sel.has(k) ? "true" : "false", disabled: solved, onclick: () => {
        if (sel.has(k)) sel.delete(k); else { if (pick === 1) sel.clear(); else if (sel.size >= pick) return; sel.add(k); }
        draw();
      } }, options[k])));
    };
    draw();
    if (pick > 1) box.append(el("p", { class: "muted", style: "margin:0" }, `${pick}개를 고르세요.`));
    box.append(wrap);
    check = () => sel.size < pick ? (pick > 1 ? `${pick}개를 골라 주세요.` : "답을 골라 주세요.") : answer.every(a => sel.has(a));
  }

  if (t.type === "sort") {
    const order = shuffledIdx(t.cards.length); const as = {};
    const list = el("div", { class: "sort" });
    order.forEach(k => {
      const seg = el("div", { class: "seg", role: "group" });
      const draw = () => { seg.innerHTML = ""; t.bins.forEach((b, bi) => seg.append(el("button", { class: as[k] === bi ? "sel" : "", "aria-pressed": as[k] === bi ? "true" : "false", disabled: solved, onclick: () => { as[k] = bi; draw(); } }, b))); };
      draw();
      list.append(el("div", { class: "sort-row" }, el("span", null, t.cards[k][0]), seg));
    });
    box.append(list);
    check = () => {
      if (Object.keys(as).length < t.cards.length) return "모든 카드를 분류해 주세요.";
      const right = t.cards.filter((c, k) => as[k] === c[1]).length;
      return right === t.cards.length ? true : { wrong: `${t.cards.length}개 중 ${right}개가 맞았어요. 틀린 카드를 찾아 다시 분류해 보세요.` };
    };
  }

  if (t.type === "match") {
    const rights = shuffle(t.pairs.map(p => p[1]));
    const sels = [];
    const list = el("div", { class: "match" });
    t.pairs.forEach((p, k) => {
      const s = el("select", { id: "m" + k, "aria-label": p[0] + "의 짝" }, el("option", { value: "" }, "골라 주세요"), rights.map(v => el("option", { value: v }, v)));
      sels.push(s);
      list.append(el("div", { class: "match-row" }, el("b", null, p[0]), s));
    });
    box.append(list);
    check = () => {
      if (sels.some(s => !s.value)) return "모든 칸을 골라 주세요.";
      const right = t.pairs.filter((p, k) => sels[k].value === p[1]).length;
      return right === t.pairs.length ? true : { wrong: `${t.pairs.length}개 중 ${right}개가 맞았어요.` };
    };
    box._lock = () => sels.forEach(s => s.disabled = true);
  }

  if (t.type === "number") {
    const inp = el("input", { id: "numans", type: "text", inputmode: "numeric", autocomplete: "off", placeholder: "숫자" });
    inp.addEventListener("keydown", e => { if (e.key === "Enter") checkBtn.click(); });
    box.append(el("div", { class: "num" }, inp, el("span", { class: "muted" }, "입력 후 확인을 눌러요")));
    check = () => { const v = inp.value.replace(/[^\d.]/g, ""); if (!v) return "숫자를 입력해 주세요."; return Number(v) === t.answer; };
    box._lock = () => inp.disabled = true;
    setTimeout(() => inp.focus({ preventScroll: true }), 0);
  }

  checkBtn.addEventListener("click", () => {
    if (solved) { onSolved(); return; }
    const res = check();
    fb.className = "fb"; fb.innerHTML = "";
    if (res === true) {
      solved = true;
      fb.classList.add("ok"); fb.append(el("img", { src: "img/bot-yay.png", alt: "" }), el("div", null, "정답이에요!", el("p", null, t.explain)));
      box.querySelectorAll(".opt, .seg button, .btn.ghost").forEach(b => b.disabled = true);
      if (box._lock) box._lock();
      checkBtn.textContent = "다음 ▶";
      checkBtn.focus();
    } else if (typeof res === "string") {
      fb.classList.add("bad"); fb.textContent = res;
    } else {
      state.wrong++; save();
      fb.classList.add("bad"); fb.append(el("img", { src: "img/bot-hmm.png", alt: "" }), el("div", null, "아직 아니에요.", el("p", null, (res && res.wrong) || "단서 노트를 다시 읽고 생각해 보세요.")));
    }
  });

  box.append(fb, el("div", { class: "row" }, checkBtn));
  return box;
}

function rankOf(sec, hints, wrong) {
  /* 수석: 10분 이내 · 힌트 0개 · 오답 2개 이하 / 책임: 15분 이내 · 힌트 1개 이하 · 오답 3개 이하 */
  if (sec <= 10 * 60 && hints === 0 && wrong <= 2) return "AI 수석 연구원";
  if (sec <= 15 * 60 && hints <= 1 && wrong <= 3) return "AI 책임 연구원";
  return "AI 연구원";
}
function clock(ms) { const d = new Date(ms); return `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${pad2(d.getMinutes())}`; }

/* 내 도전 기록 (이 기기에 보관) — 다시 도전해도 지난 기록은 그대로 남아요. 서버로 못 보낸 기록은 다음에 다시 보내요. */
const HKEY = KEY + ":history";
function loadHist() { try { return JSON.parse(localStorage.getItem(HKEY)) || []; } catch (e) { return []; } }
function saveHist(h) { try { localStorage.setItem(HKEY, JSON.stringify(h.slice(-60))); } catch (e) {} }
const sameRec = (a, b) => a.startedAt === b.startedAt && rkey(a) === rkey(b);
function recordHistory() {
  if (!state.ban || !state.finishedAt) return;
  const rec = resultRecord(state), h = loadHist();
  if (!h.some(x => sameRec(x, rec))) { rec.sent = !!state.sent; h.push(rec); saveHist(h); }
}
function markSent(rec) { const h = loadHist(); const e = h.find(x => sameRec(x, rec)); if (e && !e.sent) { e.sent = true; saveHist(h); } }
function flushOutbox() {
  if (!ONLINE) return;
  loadHist().filter(x => !x.sent).forEach(rec => {
    if (state.view === "cert" && !state.sent && rec.startedAt === state.startedAt) return;   // 지금 화면에서 보내는 중인 기록
    api("submit", { record: rec }).then(() => markSent(rec), e => { if (e.code === "bad_time" || e.code === "bad_record") markSent(rec); });
  });
}
function myHistoryPanel() {
  const cur = resultRecord(state);
  const mine = withAttempts(loadHist().filter(x => rkey(x) === rkey(cur))).sort((a, b) => a.attempt - b.attempt);
  if (mine.length < 2) return null;
  const now = mine.find(x => x.startedAt === cur.startedAt);
  return el("div", { class: "panel task" },
    el("h3", { style: "font-size:22px" }, "나의 도전 기록"),
    el("p", { style: "margin:0" }, now ? `이번이 ${now.attempt}번째 도전이에요. ` : "", now && now.isBest ? el("b", { class: "best-tag" }, "★ 최고 기록 갱신!") : "실시간 순위에는 가장 좋은 기록이 올라가요."),
    el("div", { class: "tbl-wrap" }, el("table", { class: "rank-tbl" },
      el("thead", null, el("tr", null, ["회차", "걸린 시간", "오답", "힌트", "등급", "탈출 시각", ""].map(h => el("th", null, h)))),
      el("tbody", null, mine.map(r => el("tr", { class: r.isBest ? "top1" : "" },
        el("td", null, r.attempt + "회"),
        el("td", null, fmt(r.elapsed)),
        el("td", null, String(r.wrong)),
        el("td", null, String(r.hints)),
        el("td", null, rankOf(r.elapsed, r.hints, r.wrong).replace("AI ", "")),
        el("td", null, clock(r.finishedAt)),
        el("td", null, [r.isBest ? "★ 최고" : "", r.startedAt === cur.startedAt ? " (이번)" : ""].join("").trim())
      ))))));
}
function retryControls() {
  const again = () => {
    const s = state; state = blank();
    ["school", "grade", "ban", "num", "name"].forEach(k => { state[k] = s[k]; });
    state.startedAt = Date.now();

    el("button", { class: "btn primary", onclick: again }, "한 번 더 도전하기"),

/* 수퍼베이스로 탈출 기록 보내기 */
let sending = false;
function resultRecord(s) {
  const sec = Math.round((s.finishedAt - s.startedAt) / 1000);
  return { school: s.school || "", grade: s.grade, ban: s.ban, num: s.num, name: s.name,
    elapsed: sec, wrong: s.wrong, hints: s.hints.length, rank: rankOf(sec, s.hints.length, s.wrong), startedAt: s.startedAt, finishedAt: s.finishedAt };
}
function sendResult(onDone) {
  if (!ONLINE || !state.ban || sending) return;
  sending = true;
  const s = state, rec = resultRecord(s);
  api("submit", { record: rec })
    .then(() => { s.sent = true; markSent(rec); if (s === state) save(); }, () => { s.sendFailed = true; })
    .finally(() => { sending = false; if (s === state) onDone(); });
}
function sendStatus() {
  const box = el("div", { class: "send", role: "status" });
  const draw = () => {
    box.innerHTML = "";
    if (state.sent) box.append(el("div", { class: "fb ok" }, el("img", { src: "img/bot-yay.png", alt: "" }), el("div", null, "탈출 기록을 저장했어요!", el("p", null, "탈출 결과판에서 내 이름을 찾아보세요."))));

const rkey = r => [String(r.school).trim(), toInt(r.grade), toInt(r.ban), toInt(r.num)].join("|");
/* 기록 비교: 걸린 시간 → 오답 → 힌트 → 먼저 끝낸 기록 순으로 좋은 기록 (음수면 a가 더 좋음) */
const better = (a, b) => (a.elapsed - b.elapsed) || (a.wrong - b.wrong) || (a.hints - b.hints) || (a.finishedAt - b.finishedAt);
/* 학생마다 가장 좋은 기록 하나만 (tries: 도전 횟수) */
function bestPerStudent(rows) {
  const m = {};
  rows.forEach(r => {
    const k = rkey(r), cur = m[k];
    if (!cur) m[k] = Object.assign({}, r, { sid: k, tries: 1 });
    else if (better(r, cur) < 0) m[k] = Object.assign({}, r, { sid: k, tries: cur.tries + 1 });
    else cur.tries++;
  });
  return Object.values(m);
}
/* 모든 기록에 회차(attempt), 도전 횟수(tries), 최고 기록 여부(isBest) 붙이기 */
function withAttempts(rows) {
  const g = {}; rows.forEach(r => { const k = rkey(r); (g[k] = g[k] || []).push(r); });
  const out = [];
  Object.values(g).forEach(list => {
    list.sort((a, b) => a.finishedAt - b.finishedAt);
    const best = list.slice().sort(better)[0];
    list.forEach((r, i) => out.push(Object.assign({}, r, { attempt: i + 1, tries: list.length, isBest: r === best })));
  });
  return out;
}

function viewBoard() {

  const full = el("button", { class: "btn ghost small", onclick: () => { try { const p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => {}); } catch (e) {} } }, "전체 화면");
  const sec = el("section", { class: "task board" },
    el("div", { class: "room-head" },
      el("div", null, el("div", { class: "eyebrow" }, "AI 연구소 탈출 · LIVE"), el("h2", { class: "board-title" }, "실시간 탈출 순위")),
      el("div", { class: "row" }, full, el("button", { class: "btn ghost small", onclick: () => { teacherMode = false; if (location.hash === "#board") history.replaceState(null, "", location.pathname + location.search); render(); } }, "← 게임 화면으로"))),
    el("div", { class: "row", style: "justify-content:space-between" }, B.els.chips, B.els.ctrl),
    B.els.live,
    B.els.meta,
    B.els.list
  );
  if (!ONLINE) {
    B.els.list.append(el("div", { class: "empty" }, el("img", { src: "img/bot-hmm.png", alt: "" }),
      el("p", null, "수퍼베이스에 연결되지 않았어요. 인터넷 연결과 index.html의 SUPABASE_URL · SUPABASE_KEY를 확인해 주세요.")));
    return sec;
  }
  B.els.list.append(el("p", { class: "muted" }, "순위를 불러오는 중…"));
  drawLive();
  boardFetch();
  /* 새 기록은 실시간으로 들어와요. 혹시 놓친 것이 있을까 봐 30초마다 한 번 더 확인해요. */
  boardTimer = setInterval(boardFetch, 30000);
  return sec;
}

function drawBoard() {
  if (teacherMode !== "board" || !B.els) return;
  const E = B.els;
  drawLive();
  const dayStart = new Date(); dayStart.setHours(0, 0, 0, 0);
  const timeOk = B.all.filter(r => (!B.today || r.finishedAt >= dayStart.getTime()) && (!B.cutoff || r.finishedAt >= B.cutoff - 30000));
  const schoolList = uniq(CFG.schools.concat(B.all.map(r => r.school)).filter(Boolean));
  if (B.school && !schoolList.includes(B.school)) B.school = "";
  const pool = bestPerStudent(timeOk.filter(r => !B.school || r.school === B.school));
  const manySchools = !B.school && uniq(pool.map(r => r.school)).length > 1;
  /* 여러 학교를 한꺼번에 볼 때는 반 단추를 숨겨요 (학교마다 반이 달라서) */
  const bans = manySchools ? [] : uniq(pool.map(ckey)).sort((a, b) => a - b);
  const lab = classLabeler(pool);
  if (B.filter && !bans.includes(B.filter)) B.filter = 0;
  E.chips.innerHTML = "";
  [0, ...bans].forEach(b => E.chips.append(el("button", { class: "chip-btn" + (B.filter === b ? " sel" : ""), "aria-pressed": B.filter === b ? "true" : "false", onclick: () => { B.filter = b; drawBoard(); } },
    (b ? lab(b) : "전체") + " " + (b ? pool.filter(r => ckey(r) === b).length : pool.length))));
  E.ctrl.innerHTML = "";
  if (schoolList.length > 1) E.ctrl.append(schoolSelect("board-school", schoolList, B.school, v => { B.school = v; B.filter = 0; drawBoard(); }));
  const seg = el("div", { class: "seg" });
  [["elapsed", "최고 기록 순"], ["finished", "먼저 끝낸 순"]].forEach(([k, t]) => seg.append(el("button", { class: B.sort === k ? "sel" : "", "aria-pressed": B.sort === k ? "true" : "false", onclick: () => { B.sort = k; drawBoard(); } }, t)));
  E.ctrl.append(seg, el("button", { class: "chip-btn" + (B.today ? " sel" : ""), "aria-pressed": B.today ? "true" : "false", onclick: () => { B.today = !B.today; drawBoard(); } }, "오늘 기록만"));
  const setCutoff = v => { B.cutoff = v; B.askReset = false; try { v ? localStorage.setItem(BKEY, String(v)) : localStorage.removeItem(BKEY); } catch (e) {} drawBoard(); };
  if (B.askReset) E.ctrl.append(el("span", { class: "confirm" }, "지금까지 순위를 화면에서 비울까요? (저장된 기록은 남아요)",
    el("button", { class: "btn primary small", onclick: () => setCutoff(Date.now()) }, "새 판 시작"),
    el("button", { class: "btn ghost small", onclick: () => { B.askReset = false; drawBoard(); } }, "취소")));
  else E.ctrl.append(el("button", { class: "btn small", onclick: () => { B.askReset = true; drawBoard(); } }, "새 판 시작"));
  if (B.cutoff && !B.askReset) E.ctrl.append(el("button", { class: "btn ghost small", onclick: () => setCutoff(0) }, "이전 기록도 보기"));

  const rows = pool.filter(r => !B.filter || ckey(r) === B.filter)
    .sort(B.sort === "elapsed" ? better : (a, b) => (a.finishedAt - b.finishedAt) || better(a, b));
  E.meta.textContent = B.err || (B.updated ? (B.school ? B.school + " · " : "") + (B.cutoff ? `${new Date(B.cutoff).toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit" })}부터 · ` : "") + `탈출 ${rows.length}명 · 학생마다 가장 좋은 기록으로 순위를 매겨요 · ${LIVE.ready ? "실시간 연결됨" : "연결하는 중"} · 마지막 확인 ${new Date(B.updated).toLocaleTimeString("ko-KR")}` : "");
  E.list.innerHTML = "";
  if (!rows.length) {
    if (!B.err) E.list.append(el("div", { class: "empty" }, el("img", { src: "img/bot-search.png", alt: "" }), el("p", null, "아직 탈출한 연구원이 없어요. 첫 번째 탈출자는 누가 될까요?")));
    return;
  }
  rows.forEach((r, i) => E.list.append(el("div", { class: "brow" + (i < 3 ? " top" + (i + 1) : "") + (B.fresh.has(r.sid) ? " fresh" : "") },
    el("span", { class: "place" }, String(i + 1)),
    el("span", { class: "bname" }, r.name, el("small", null, (manySchools && r.school ? r.school + " · " : "") + (manySchools || lab(1).includes("학년") ? r.grade + "학년 " : "") + `${r.ban}반 ${r.num}번` + (r.tries > 1 ? ` · 도전 ${r.tries}회` : ""))),
    el("span", { class: "bstat" }, el("b", null, fmt(r.elapsed)), el("small", null, "걸린 시간")),
    el("span", { class: "bstat" }, el("b", null, String(r.wrong)), el("small", null, "오답")),
    el("span", { class: "bstat" }, el("b", null, String(r.hints)), el("small", null, "힌트"))
  )));
}

if (/^#(teacher|admin)$/.test(location.hash) || BOOT.view === "teacher" || BOOT.view === "admin") teacherMode = "admin";
if (location.hash === "#board" || BOOT.view === "board") teacherMode = "board";
render();
flushOutbox();
/* 수퍼베이스에 저장된 학교 목록을 불러와 반영 */
fetchConfig().then(changed => {
  if (!changed) return;
  if (!teacherMode && state.view === "start") render();
  if (teacherMode === "admin" && !A.dirty) { A.draft = clone(CFG); drawAdmin(); }
});
/* ============ 실시간: 접속자 현황(Presence) · 탈출 팝업 ============ */
function startLive() {
  if (!sb || LIVE.chan) return;
  const ch = sb.channel("ai-lab-escape-live", { config: { presence: { key: LIVE.me } } });
  LIVE.chan = ch;
  ch.on("presence", { event: "sync" }, () => {
    const st = ch.presenceState();
    LIVE.players = Object.entries(st).map(([k, metas]) => Object.assign({ key: k }, metas[metas.length - 1] || {})).filter(p => p.role === "player");
    drawLiveCount(); drawLive();
  });
  ch.on("postgres_changes", { event: "INSERT", schema: "public", table: "escape_records" }, p => onRecordInsert(p.new));
  ch.on("postgres_changes", { event: "DELETE", schema: "public", table: "escape_records" }, p => onRecordDelete(p.old));
  ch.subscribe(status => {
    if (status === "SUBSCRIBED") {
      const was = LIVE.ready;
      LIVE.ready = true; LIVE.sent = "";
      syncPresence();
      /* 연결이 끊겼다 다시 붙었으면 그동안 놓친 기록을 한 번 불러와요 */
      if (was && teacherMode === "board") boardFetch();
    } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") {
      LIVE.ready = false; LIVE.sent = "";
    }
    if (teacherMode === "board") drawBoard();
  });
}
function presencePayload() {
  if (teacherMode || !state.ban || state.view === "start" || !state.startedAt) return null;
  const where = state.view === "room" && ROOMS[state.room] ? ROOMS[state.room].id + " " + ROOMS[state.room].name
    : state.view === "final" ? "탈출문" : state.view === "cert" ? "탈출 성공" : "연구소 지도";
  return { role: "player", school: state.school || "", grade: state.grade, ban: state.ban, num: state.num, name: state.name,
    where: where, cleared: state.cleared.length, startedAt: state.startedAt, finishedAt: state.finishedAt || 0 };
}
function syncPresence() {
  if (!LIVE.chan || !LIVE.ready) return;
  const p = presencePayload();
  const sig = p ? JSON.stringify(p) : "none";
  if (sig === LIVE.sent) return;
  LIVE.sent = sig;
  /* 수퍼베이스는 접속 신호를 보낸 화면에만 접속자 목록을 보내 줘요. 결과판 · 관리자 · 시작 화면은 '관람자'로 신호만 보내고 목록에서는 빠져요. */
  try { LIVE.chan.track(p || { role: "viewer" }); } catch (e) {}
}
/* 상태바: 같은 학교에서 지금 도전 중인 사람 수 */
function drawLiveCount() {
  const n = document.getElementById("livecount");
  if (!n) return;
  const mine = LIVE.players.filter(p => !p.finishedAt && (!state.school || p.school === state.school));
  n.hidden = !LIVE.ready || !mine.length;
  n.textContent = `${mine.length}명 도전 중`;
  n.title = "지금 접속해서 도전 중인 학생 수";
}
/* 결과판: 지금 접속 중인 학생 카드 */
function livePlayersForBoard() {
  return LIVE.players.filter(p => (!B.school || p.school === B.school) && (!B.filter || ckey(p) === B.filter))
    .sort((a, b) => (!!a.finishedAt - !!b.finishedAt) || (b.cleared - a.cleared) || (a.startedAt - b.startedAt));
}
function drawLive() {
  if (teacherMode !== "board" || !B.els || !B.els.live) return;
  const box = B.els.live; box.innerHTML = "";
  const list = livePlayersForBoard();
  const playing = list.filter(p => !p.finishedAt).length;
  const many = !B.school && uniq(list.map(p => p.school)).length > 1;
  box.append(el("div", { class: "live-head" },
    el("h3", null, `지금 접속 중 ${list.length}명`),
    el("span", { class: "muted", style: "font-size:14px" }, LIVE.ready ? `도전 중 ${playing}명 · 탈출 ${list.length - playing}명` : "실시간 서버에 연결하는 중…")));
  if (!list.length) { box.append(el("p", { class: "muted", style: "margin:0" }, LIVE.ready ? "아직 접속한 학생이 없어요. 학생이 입장하면 여기에 바로 나타나요." : "")); return; }
  const grid = el("div", { class: "live-grid" });
  list.forEach(p => grid.append(el("div", { class: "lp" + (p.finishedAt ? " done" : "") },
    el("div", { class: "lp-top" },
      el("span", { class: "lp-name" }, p.name, el("small", null, (many && p.school ? p.school + " · " : "") + `${p.grade}학년 ${p.ban}반 ${p.num}번`)),
      el("span", { class: "lp-time", "data-start": p.startedAt, "data-fin": p.finishedAt || 0 }, fmt(((p.finishedAt || Date.now()) - p.startedAt) / 1000))),
    el("div", { class: "lp-where" }, p.finishedAt ? "탈출 성공 ✓" : p.where),
    el("div", { class: "lp-bar", "aria-label": `코드 조각 ${p.cleared} / ${ROOMS.length}` }, ROOMS.map((r, i) => el("i", { class: i < p.cleared ? "on" : "" }))))));
  box.append(grid);
}
function drawLiveTimes() {
  if (!B.els || !B.els.live) return;
  B.els.live.querySelectorAll(".lp-time").forEach(t => {
    const st = Number(t.dataset.start), fin = Number(t.dataset.fin);
    if (st) t.textContent = fmt(((fin || Date.now()) - st) / 1000);
  });
}
/* 새 탈출 기록이 저장되면: 결과판 · 관리자 화면에 바로 반영하고 팝업을 띄워요 */
function onRecordInsert(row) {
  if (!row) return;
  const r = fromDb(row);
  if (!okRow(r)) return;
  if (B.all && !B.all.some(x => x.id === r.id)) { if (teacherMode === "board") boardApply(B.all.concat([r])); else B.all.push(r); }
  if (A.rows && !A.rows.some(x => x.id === r.id)) { A.rows = A.rows.concat([r]); if (teacherMode === "admin" && A.tab === "results") drawAdmin(); }
  showEscapePopup(r);
}
function onRecordDelete(old) {
  const id = old && String(old.record_id || "");
  if (!id) return;
  if (B.all.some(x => x.id === id)) { B.all = B.all.filter(x => x.id !== id); B.seen = null; if (teacherMode === "board") drawBoard(); }
  if (A.rows && A.rows.some(x => x.id === id)) { A.rows = A.rows.filter(x => x.id !== id); if (teacherMode === "admin" && A.tab === "results") drawAdmin(); }
}
function showEscapePopup(r) {
  /* 늦게 다시 보낸 예전 기록은 팝업 없이 */
  if (Date.now() - r.finishedAt > 10 * 60 * 1000) return;
  /* 내 기록이면 이미 인증서 화면을 보고 있으니 생략 */
  if (state.ban && r.startedAt === state.startedAt && rkey(r) === rkey(state)) return;
  if (teacherMode === "board") { if (B.school && r.school !== B.school) return; if (B.filter && ckey(r) !== B.filter) return; }
  else if (teacherMode !== "admin" && state.school && r.school && r.school !== state.school) return;
  let wrap = document.getElementById("pops");
  if (!wrap) { wrap = el("div", { id: "pops", class: "pops", role: "status", "aria-live": "polite" }); document.body.append(wrap); }
  wrap.className = "pops" + (teacherMode === "board" ? " big" : "");
  while (wrap.children.length >= 3) wrap.firstChild.remove();
  const tryText = r.attempt > 1 ? ` · ${r.attempt}번째 도전` : "";
  const card = el("button", { class: "epop", type: "button", "aria-label": "알림 닫기" },
    el("img", { src: "img/trophy.png", alt: "" }),
    el("div", { class: "ep-k" }, "ESCAPED · 탈출 성공"),
    el("div", { class: "ep-n" }, `${r.name} 탈출!`),
    el("div", { class: "ep-s" }, `${r.school ? r.school + " · " : ""}${r.grade}학년 ${r.ban}반 ${r.num}번 · ${fmt(r.elapsed)} · 오답 ${r.wrong} · 힌트 ${r.hints}${tryText}`));
  const close = () => { if (card.classList.contains("out")) return; card.classList.add("out"); setTimeout(() => card.remove(), 400); };
  card.addEventListener("click", close);
  wrap.append(card);
  setTimeout(close, teacherMode === "board" ? 7000 : 5000);
}
startLive();
timerId = setInterval(tick, 1000);
</script>
